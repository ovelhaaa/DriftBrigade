name: DriftBrigade qualification
on: [push, pull_request]
jobs:
  dsp:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DDRIFT_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  bakeoff:
    needs: dsp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target drift_bakeoff --parallel 2
      - run: ./build/drift_bakeoff artifact
      - run: cp docs/m1_1_listening_guide.md artifact/LISTENING_GUIDE.md
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M1.1-Bakeoff
          path: artifact/
  bbd-qualification:
    needs: dsp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target drift_bbd_tests drift_bbd_qualification --parallel 2
      - run: ./build/drift_bbd_tests
      - run: ./build/drift_bbd_qualification artifact
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M2.1-BBD-Linear-Qualification
          path: artifact/
  bbd-character-qualification:
    needs: [dsp, sanitize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target drift_bbd_character_tests drift_bbd_character_qualification --parallel 2
      - run: ./build/drift_bbd_character_tests
      - run: ./build/drift_bbd_character_qualification artifact
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M2.2-BBD-Character-Qualification
          path: artifact/
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-Windows
          path: build/DriftBrigade_artefacts/Release/
  bbd-performance-qualification:
    needs: [dsp, sanitize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target drift_bbd_performance_qualification --parallel 2
      - run: ./build/drift_bbd_performance_qualification artifact
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M2.3-BBD-Performance-Qualification
          path: artifact/
  bbd-nonlinear-qualification:
    needs: [dsp, sanitize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target drift_bbd_nonlinear_qualification --parallel 2
      - run: ./build/drift_bbd_nonlinear_qualification artifact
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M2.4-BBD-Nonlinear-Qualification
          path: artifact/
  bbd-compander-qualification:
    needs: [dsp, sanitize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DDRIFT_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target drift_bbd_compander_qualification --parallel 2
      - run: ./build/drift_bbd_compander_qualification artifact
      - uses: actions/upload-artifact@v4
        with:
          name: DriftBrigade-M2.5-BBD-Compander-Qualification
          path: artifact/
